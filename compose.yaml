services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studentplan}
      POSTGRES_USER: ${POSTGRES_USER:-studentplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studentplan_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studentplan} -d ${POSTGRES_DB:-studentplan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://studentplan:studentplan_dev_password@db:5432/studentplan}
      SECRET_KEY: ${SECRET_KEY:-development_secret_key_change_me_1234567890}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Yekaterinburg}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      UPLOADS_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@studentplan.ru}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin12345}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Администратор StudentPlan}
      INITIAL_GROUP_CODE: ${INITIAL_GROUP_CODE:-НМТ-333901}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
